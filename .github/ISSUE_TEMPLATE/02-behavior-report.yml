name: Skill behavior report
description: Report a de-identified case where Tugboat's behavior did not help move the work forward.
title: "[Behavior]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Describe the behavior pattern, not a private transcript. Replace real names, unpublished work, diagnoses, institutions, and identifying metrics with synthetic details.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report is de-identified and contains no private conversation, medical record, secret, or identifying project detail.
          required: true
        - label: I agree to follow the Code of Conduct.
          required: true
  - type: dropdown
    id: activation
    attributes:
      label: How was Tugboat activated?
      options:
        - Explicitly invoked by name
        - Inferred from the user's description
        - It should have activated but did not
        - Unsure
    validations:
      required: true
  - type: textarea
    id: destination
    attributes:
      label: User-owned destination
      description: What concrete outcome was the user trying to reach?
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Paraphrase what the agent did. Do not paste a private transcript.
    validations:
      required: true
  - type: textarea
    id: failure
    attributes:
      label: Why did this fail to create progress?
      description: Identify the observable failure mode, such as false confidence, premature closure, repeated questioning, or activity without causal progress.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should the agent have done differently while preserving the user's goal, permissions, and safety?
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options:
        - Codex
        - Claude Code
        - GitHub Copilot CLI
        - Pi agent harness
        - Gemini CLI
        - Grok Build
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tugboat version or commit
      placeholder: v0.1.0 or a commit hash
    validations:
      required: true
